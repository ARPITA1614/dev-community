services:
  - type: web
    name: dev-community
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: dev-community-db
          property: connectionString

databases:
  - name: dev-community-db
    plan: free
    databaseName: dev-community
    user: arpita
